
name: Build Streams Master

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-streams-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: node --check scripts/buildStreamsMaster.js

      - name: Build streams master
        run: node scripts/buildStreamsMaster.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit updated streamsMaster
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/streamsMaster.json

          if git diff --cached --quiet; then
            echo "streamsMaster.json に変更はありません。"
          else
            git commit -m "Build streams master"
            git push
          fi
